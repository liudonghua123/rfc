# Name: Automated RFCs Data Synchronization
name: Sync RFCs Data

# Trigger conditions: Manual execution + Weekly scheduled run
on:
  # 1. Manual trigger (one-click run in GitHub repository)
  workflow_dispatch:
  # 2. Scheduled trigger: Every Saturday at 00:00 UTC (08:00 Beijing Time)
  schedule:
    - cron: '0 0 * * 6'

# Grant write permissions for committing and pushing code
permissions:
  contents: write

# Job definition
jobs:
  sync-rfcs:
    # Run on the latest Ubuntu environment
    runs-on: ubuntu-latest
    steps:
      # Step 1: Check out the repository code to the runner
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1  # Shallow clone for faster execution

      # Step 2: Install rsync utility (required for synchronization)
      - name: Install rsync
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync

      # Step 3: Execute rsync synchronization command
      - name: Sync RFCs data via rsync
        run: |
          rsync -avz --delete rsync.rfc-editor.org::rfcs data
          python fetch_rfc_index.py 

      # Step 4: Commit changes and push to remote repository
      - name: Commit and push changes
        run: |
          # Configure Git user identity (required for GitHub Actions environment)
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage all modified files
          git add .
          
          # Skip empty commit if no changes detected
          if git diff --cached --quiet; then
            echo "✅ No file changes detected, skipping commit"
            exit 0
          fi
          
          # Commit changes with timestamp and push to remote
          git commit -m "🔄 Auto-update RFCs data via rsync $(date -u +'%Y-%m-%d %H:%M:%S') UTC"
          git push
